<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{ stadium.name }}</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f5f5f5;
        }

        header {
            background: #198754;
            color: white;
            padding: 20px 10%;
        }

        header a {
            color: white;
            text-decoration: none;
        }

        .container {
            width: 80%;
            margin: 40px auto;
        }

        .info {
            background: white;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 30px;
        }

        .field {
            background: white;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 10px;
        }

        .price {
            color: #198754;
            font-weight: bold;
        }

        button {
            background: #198754;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<header>
    <h1>⚽ ĐẶT SÂN BÓNG</h1>
    <a href="/">← Quay lại trang chủ</a>
</header>

<div class="container">

    <div class="info">
        <h1>{{ stadium.name }}</h1>

        <p>📍 {{ stadium.address }}</p>

        <p>
            Loại sân:
            {{ stadium.get_field_type_display }}
        </p>

        <p>{{ stadium.description }}</p>
    </div>

    <h2>Danh sách sân</h2>

    {% for field in fields %}

        <div class="field">

            <h3>{{ field.name }}</h3>

            <p class="price">
                {{ field.price_per_hour }} VNĐ / giờ
            </p>

            <a href="{% url 'field_schedule' field.id %}">
    <button>Xem lịch trống</button>
</a>

        </div>

    {% empty %}

        <div class="field">
            Chưa có sân con.
        </div>

    {% endfor %}

</div>

</body>
</html>
